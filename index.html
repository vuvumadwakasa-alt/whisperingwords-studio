<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whispering-Words Studio</title><style>body{margin:0;background:#000;color:#fff;font-family:'Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}.header{background:#0a0a0a;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #D4AF37}.logo{color:#D4AF37;font-weight:bold;font-size:16px}.btn{background:#1a1a1a;border:1px solid #D4AF37;color:#D4AF37;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer}.toolbar{display:flex;gap:6px;padding:10px;background:#000;border-bottom:1px solid #222;overflow-x:auto}.tool{background:#111;border:1px solid #333;color:#D4AF37;padding:6px 12px;font-size:11px;white-space:nowrap;border-radius:4px;cursor:pointer}.tool:active{background:#D4AF37;color:#000}#editor{flex:1;background:#000;color:#fff;border:none;padding:18px;font-family:'Courier New',monospace;font-size:15px;line-height:1.7;outline:none;resize:none}</style></head><body><div class="header"><div class="logo">Whispering-Words</div><div><select id="format" class="btn" style="margin-right:5px"><option>SCREENPLAY</option><option>RADIO DRAMA</option><option>THEATRE</option></select><button class="btn" onclick="save()">💾 Save</button></div></div><div class="toolbar" id="tools"></div><textarea id="editor" placeholder="INT. WHISPERING WORDS STUDIO - NIGHT

The cursor blinks. Your story begins...

Type here, or tap the buttons above for formatting."></textarea><script>const formats={SCREENPLAY:[["SCENE","\\nINT. LOCATION - DAY\\n\\n"],["ACTION",""],["CHARACTER","\\nCHARACTER NAME\\n"],["DIALOGUE"," "],["PAREN"," ("],["TRANS","\\nCUT TO:\\n\\n"]],"RADIO DRAMA":[["SCENE","\\nSCENE 1.\\n\\n"],["NARRATOR","\\nNARRATOR:\\n"],["CHARACTER","\\nNAME:\\n"],["SFX","\\n[SFX: "],["MUSIC","\\n[MUSIC: "]],"THEATRE":[["ACT","\\nACT I\\n\\n"],["SCENE","\\nSCENE 1\\n\\n"],["CHARACTER","\\nCHARACTER NAME.\\n"],["DIALOGUE"," "],["STAGE","\\n[Stage direction]\\n"]]};function loadTools(){const f=document.getElementById('format').value;const t=document.getElementById('tools');t.innerHTML='';formats[f].forEach(([label,text])=>{const b=document.createElement('button');b.className='tool';b.textContent=label;b.onclick=()=>{const e=document.getElementById('editor');const s=e.selectionStart;e.value=e.value.slice(0,s)+text+e.value.slice(e.selectionEnd);e.selectionStart=e.selectionEnd=s+text.length;e.focus()};t.appendChild(b)})}document.getElementById('format').onchange=loadTools;loadTools();const ed=document.getElementById('editor');ed.value=localStorage.getItem('wws-story')||'';ed.oninput=()=>localStorage.setItem('wws-story',ed.value);function save(){localStorage.setItem('wws-story',ed.value);alert('✓ Saved to browser!')}</script></body></html>
