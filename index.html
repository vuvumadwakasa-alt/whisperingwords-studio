<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Whispering Words Studio</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:#e9edf5;
  font-family:Arial,sans-serif;
}

header{
  padding:16px;
  background:#10151d;
  border-bottom:1px solid #29313d;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:22px;
  font-weight:800;
  color:#d4af37;
}

.subtitle{
  font-size:12px;
  color:#8792a3;
  margin-top:4px;
}

.toolbar{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:12px 0 2px;
}

button,select{
  background:#171e28;
  color:#e9edf5;
  border:1px solid #303b49;
  border-radius:7px;
  padding:9px 12px;
  white-space:nowrap;
  cursor:pointer;
}

button:hover{
  border-color:#d4af37;
}

.primary{
  background:#d4af37;
  color:#080b10;
  border-color:#d4af37;
  font-weight:bold;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.panel{
  background:#10151d;
  border:1px solid #29313d;
  border-radius:10px;
  margin-bottom:16px;
  overflow:hidden;
}

.panel-title{
  padding:12px 15px;
  border-bottom:1px solid #29313d;
  font-weight:bold;
}

.editor{
  min-height:65vh;
  padding:25px;
  outline:none;
  font-family:"Courier New",monospace;
  font-size:15px;
  line-height:1.65;
  white-space:pre-wrap;
}

.editor:focus{
  box-shadow:inset 0 0 0 1px #d4af37;
}

.status{
  padding:9px 14px;
  color:#8995a7;
  font-size:12px;
  border-top:1px solid #29313d;
}

.ai{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  padding:14px;
}

.ai button{
  min-height:55px;
}

.footer{
  text-align:center;
  padding:25px;
  color:#667386;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <div class="brand">WHISPERING WORDS STUDIO</div>
  <div class="subtitle">AI Filmmaking & Storytelling Workspace</div>

  <div class="toolbar">
    <button onclick="formatText('SCENE')">SCENE</button>
    <button onclick="formatText('CHARACTER')">CHARACTER</button>
    <button onclick="formatText('DIALOGUE')">DIALOGUE</button>
    <button onclick="formatText('ACTION')">ACTION</button>
    <button onclick="formatText('TRANSITION')">TRANSITION</button>

    <select id="mode" onchange="changeMode()">
      <option>SCREENPLAY</option>
      <option>RADIO DRAMA</option>
      <option>THEATRE</option>
    </select>

    <button onclick="undoEdit()">UNDO</button>
    <button onclick="redoEdit()">REDO</button>
    <button onclick="saveProject()">SAVE</button>
    <button onclick="loadProject()">LOAD</button>
  </div>
</header>

<main>

<div class="panel">
  <div class="panel-title">Story Workspace</div>

  <div
    id="editor"
    class="editor"
    contenteditable="true"
    spellcheck="true"
    oninput="updateStatus()"
  >FADE IN:

INT. UNKNOWN LOCATION - NIGHT

The cursor blinks.

Your story begins...

</div>

  <div class="status" id="status">
    0 words • 0 characters
  </div>
</div>

<div class="panel">
  <div class="panel-title">Creative Intelligence</div>

  <div class="ai">

    <button onclick="aiAction('idea')">
      💡 STORY IDEA
    </button>

    <button onclick="aiAction('character')">
      👤 CHARACTER BUILDER
    </button>

    <button onclick="aiAction('scene')">
      🎬 SCENE BUILDER
    </button>

    <button onclick="aiAction('dialogue')">
      💬 DIALOGUE ASSISTANT
    </button>

    <button onclick="aiAction('shot')">
      📷 SHOT PLANNER
    </button>

    <button onclick="aiAction('storyboard')">
      🖼️ STORYBOARD
    </button>

  </div>
</div>

</main>

<div class="footer">
  Whispering Words Studio • Creative filmmaking workspace
</div>

<script>

const editor=document.getElementById("editor");

let undoStack=[];
let redoStack=[];
let lastText=editor.innerText;

function updateStatus(){

  const text=editor.innerText.trim();

  const words=text
    ? text.split(/\s+/).length
    : 0;

  document.getElementById("status").textContent=
    words+" words • "+
    text.length+" characters";

  if(text!==lastText){

    undoStack.push(lastText);

    if(undoStack.length>50){
      undoStack.shift();
    }

    lastText=text;
    redoStack=[];
  }
}

function formatText(type){

  const templates={

    SCENE:
`


INT. LOCATION - DAY

`,

    CHARACTER:
`


CHARACTER NAME
`,

    DIALOGUE:
`

Dialogue goes here.
`,

    ACTION:
`

Describe what the audience sees.
`,

    TRANSITION:
`

CUT TO:
`

  };

  editor.focus();

  document.execCommand(
    "insertText",
    false,
    templates[type] || ""
  );

  updateStatus();
}

function undoEdit(){

  if(!undoStack.length)return;

  redoStack.push(editor.innerText);

  const previous=undoStack.pop();

  editor.innerText=previous;

  lastText=previous;

  updateStatus();
}

function redoEdit(){

  if(!redoStack.length)return;

  undoStack.push(editor.innerText);

  const next=redoStack.pop();

  editor.innerText=next;

  lastText=next;

  updateStatus();
}

function saveProject(){

  localStorage.setItem(
    "whisperingWordsProject",
    editor.innerText
  );

  alert("Project saved on this device.");
}

function loadProject(){

  const saved=
    localStorage.getItem(
      "whisperingWordsProject"
    );

  if(saved){

    editor.innerText=saved;

    lastText=saved;

    updateStatus();

    alert("Project loaded.");
  }
  else{
    alert("No saved project found.");
  }
}

function changeMode(){

  const mode=
    document.getElementById("mode").value;

  if(mode==="RADIO DRAMA"){

    editor.innerText=
`RADIO DRAMA

TITLE:

NARRATOR:
The story begins...

SFX:
[Sound effect]

CHARACTER:
Dialogue...
`;

  }

  if(mode==="THEATRE"){

    editor.innerText=
`THEATRE PLAY

ACT I

SCENE 1

STAGE:
Describe the stage.

CHARACTER:
Dialogue...

[Stage direction]
`;

  }

  if(mode==="SCREENPLAY"){

    editor.innerText=
`FADE IN:

INT. LOCATION - DAY

The story begins...
`;

  }

  lastText=editor.innerText;

  updateStatus();
}

function aiAction(type){

  const messages={

    idea:
`AI STORY IDEA

A mysterious event changes the life of an ordinary person.

Expand this idea into a complete cinematic story.`,

    character:
`AI CHARACTER BUILDER

Name:
Age:
Occupation:
Personality:
Goal:
Fear:
Secret:
Character arc:`,

    scene:
`AI SCENE BUILDER

Location:
Time:
Characters:
Objective:
Conflict:
Visual atmosphere:
Scene outcome:`,

    dialogue:
`AI DIALOGUE ASSISTANT

Character 1:
Character 2:

Write natural cinematic dialogue with subtext and conflict.`,

    shot:
`SHOT PLANNER

SHOT 1:
Framing:
Camera:
Movement:
Lens:
Lighting:
Sound:

SHOT 2:`,

    storyboard:
`STORYBOARD PLAN

FRAME 1:
Visual:
Camera:
Action:
Dialogue:

FRAME 2:
Visual:
Camera:
Action:
Dialogue:`
  };

  editor.focus();

  document.execCommand(
    "insertText",
    false,
    "\n\n"+messages[type]+"\n"
  );

  updateStatus();
}

updateStatus();

</script>

</body>
  </html>
